services:
  catFacts:
    type: http
    hostname: "{{ env.CAT_FACT_HOSTNAME | default('catfact.ninja', true) }}"
    tls: true
  catFactsApi:
    type: openapi
    spec: catfact.openapi.yaml
    baseUrl: "https://{{ env.CAT_FACT_HOSTNAME | default('catfact.ninja', true) }}"
  unsigned9_mqtt:
    type: mqtt
    hostname: '{{env.MQTT_HOSTNAME}}'
    protocol: 5
  unsigned8_mqtt:
    $ref: "#/services/unsigned9_mqtt"

testCases:

  mqttPingPong:
    steps:
      - id: subscribe_for_a_message
        type: mqtt_subscribe
        service: unsigned9_mqtt
        topic: hello/world
        filter:
          publishProperties:
            correlationData: "1234"
      - id: mqtt_pub
        type: mqtt_publish
        service: unsigned8_mqtt
        topic: hello/world
        json: hi
        qos: 1
        publishProperties:
          correlationData: "1234"
      - id: check_received_message
        type: mqtt_message
        from: subscribe_for_a_message
        timeoutSeconds: 5
        expect:
          count: 1
          topic: hello/world
          json_schema:
            type: string
            const: hi

  getACatFact:
    steps:
      - id: get_a_cat_fact
        type: http_request
        service: catFacts
        path: /fact
        expect:
          status_code: 200
          json_schema:
            type: object
            properties:
              fact:
                type: string
              length:
                type: integer
            required:
              - fact
              - length

  getAShortCatFactByOperation:
    steps:
      - id: get_a_short_fact
        type: openapi_request
        service: catFactsApi
        operationId: getRandomFact
        parameters:
          max_length: 100
        # The response is first checked against catfact.openapi.yaml, then these expectations
        expect:
          status_code: 200
          json_schema:
            properties:
              length:
                maximum: 100
      - id: find_fact_length
        type: jsonpath
        from: get_a_short_fact
        pointer: /length
